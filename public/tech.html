<!DOCTYPE html>
<html>
<head>

  <title>Admin Panel</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #111;
    }

    .topBar {
      background: linear-gradient(135deg, #d71920, #a50f15);
      color: white;
      padding: 28px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .topBar h1 {
      margin: 0;
      font-size: 40px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px 60px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 24px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      border-top: 8px solid #d71920;
    }

    .card h2 {
      margin-top: 0;
      color: #d71920;
      margin-bottom: 20px;
      font-size: 28px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 16px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #d71920;
      box-shadow: 0 0 8px rgba(215,25,32,0.2);
    }

    button {
      background: #d71920;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    button:hover {
      background: #b31217;
      transform: translateY(-2px);
    }

    .danger {
      background: #dc3545;
    }

    .danger:hover {
      background: #bb2d3b;
    }

    #liveCountdown {
      font-size: 28px;
      font-weight: bold;
      background: #111;
      color: white;
      padding: 18px;
      border-radius: 14px;
      text-align: center;
      margin-top: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th {
      background: #d71920;
      color: white;
      padding: 14px;
      text-align: left;
    }

    td {
      padding: 14px;
      border-bottom: 1px solid #eee;
      vertical-align: top;
    }

    tr:hover {
      background: #fafafa;
    }

    .memberTag {
      display: inline-block;
      background: #f1f1f1;
      padding: 6px 10px;
      border-radius: 8px;
      margin: 4px;
      font-size: 14px;
    }

    .footerNote {
      text-align: center;
      margin-top: 50px;
      color: #666;
      font-size: 14px;
    }

  </style>

</head>

<body>

<script>
if (localStorage.getItem("tech") !== "true") {
  window.location.href = "tech-login.html";
}
</script>

<div class="topBar">
  <h1>Admin Control Panel</h1>
</div>

<div class="container">

  <div class="grid">

    <!-- RACE TIMER -->
    <div class="card">

      <h2>Race Timer Control</h2>

      <input
        type="datetime-local"
        id="raceEndTime"
      >

      <button onclick="setRaceTime()">
        Set Race End Time
      </button>

      <div id="liveCountdown">
        No timer set
      </div>

    </div>

    <!-- ANNOUNCEMENT -->
    <div class="card">

      <h2>Send Announcement</h2>

      <input
        id="msg"
        placeholder="Enter announcement message"
      >

      <button onclick="announce()">
        Send Announcement
      </button>

    </div>

    <!-- EXPORT -->
    <div class="card">

      <h2>Export Team Data</h2>

      <button onclick="downloadCSV()">
        Download CSV
      </button>

    </div>

  </div>

  <!-- TEAM TABLE -->
  <div class="card" style="margin-top:24px;">

    <h2>Live Team Management</h2>

    <table>

      <thead>
        <tr>
          <th style="width:10%">Team</th>
          <th style="width:10%">Score</th>
          <th style="width:35%">Members</th>
          <th style="width:45%">Actions</th>
        </tr>
      </thead>

      <tbody id="teams"></tbody>

    </table>

  </div>

  <!-- FILES -->
  <div class="card">

    <h2>Uploaded Files</h2>

    <button onclick="getFiles()">
      Refresh Files
    </button>

    <ul id="files"></ul>

  </div>

  <div class="footerNote">
    Singapore Institute of Technology Amazing Race System
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();


// ==========================
// LIVE AUTO REFRESH
// ==========================

socket.on("teamsUpdated", () => {
  getTeams();
});

socket.on("scoreUpdate", () => {
  getTeams();
});


// ==========================
// ANNOUNCEMENT
// ==========================

function announce() {

  const msg =
    document.getElementById("msg").value;

  socket.emit("announcement", msg);

  alert("Announcement Sent");
}


// ==========================
// SET RACE END TIME
// ==========================

function setRaceTime() {

  const value =
    document.getElementById("raceEndTime").value;

  if (!value) {
    alert("Select a date and time");
    return;
  }

  const endTime =
    new Date(value).getTime();

  socket.emit("setCountdown", endTime);

  alert("Race end time updated");
}


// ==========================
// LIVE COUNTDOWN
// ==========================

socket.on("countdown", (endTime) => {

  function updateCountdown() {

    const diff =
      endTime - Date.now();

    const el =
      document.getElementById("liveCountdown");

    if (diff <= 0) {

      el.innerText = "RACE ENDED";
      el.style.background = "#dc3545";

      return;
    }

    const h =
      Math.floor(diff / 3600000);

    const m =
      Math.floor((diff % 3600000) / 60000);

    const s =
      Math.floor((diff % 60000) / 1000);

    el.innerText =
      `${h}h ${m}m ${s}s remaining`;
  }

  updateCountdown();

  setInterval(updateCountdown, 1000);
});


// ==========================
// LOAD TEAMS
// ==========================

async function getTeams() {

  const res =
    await fetch("/teams");

  const data =
    await res.json();

  const tbody =
    document.getElementById("teams");

  tbody.innerHTML = "";

  data
    .sort((a, b) => Number(a.group) - Number(b.group))
    .forEach(team => {

      const tr =
        document.createElement("tr");

      tr.innerHTML = `

        <td>
          <strong>
            ${team.group}
          </strong>
        </td>

        <td>
          ${team.score?.total || 0}
        </td>

        <td>
          ${(team.members || [])
            .map(member => `
              <span class="memberTag">
                ${member}
              </span>
            `)
            .join("")}
        </td>

        <td>

          <button
            onclick="reassignPrompt('${team.group}')"
          >
            Reassign Member
          </button>

          <button
            class="danger"
            onclick="deleteTeam('${team.group}')"
          >
            Delete Team
          </button>

        </td>
      `;

      tbody.appendChild(tr);
    });
}


// ==========================
// DELETE TEAM
// ==========================

async function deleteTeam(group) {

  const confirmDelete =
    confirm(`Delete Team ${group}?`);

  if (!confirmDelete) return;

  await fetch(`/team/${group}`, {
    method: "DELETE"
  });

  getTeams();
}


// ==========================
// REASSIGN MEMBER
// ==========================

async function reassignPrompt(oldGroup) {

  const member =
    prompt("Enter member name");

  if (!member) return;

  const newGroup =
    prompt("Move to which team?");

  if (!newGroup) return;

  await fetch("/reassign-member", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      member,
      oldGroup,
      newGroup
    })
  });

  getTeams();
}


// ==========================
// DOWNLOAD CSV
// ==========================

async function downloadCSV() {

  window.location.href =
    "/export-teams";
}


// ==========================
// FILES
// ==========================

async function getFiles() {

  const res =
    await fetch("/files");

  const data =
    await res.json();

  const list =
    document.getElementById("files");

  list.innerHTML = "";

  for (let group in data) {

    const g =
      document.createElement("li");

    g.innerHTML =
      `<strong>Team ${group}</strong>`;

    list.appendChild(g);

    for (let game in data[group]) {

      const sub =
        document.createElement("ul");

      data[group][game].forEach(file => {

        const li =
          document.createElement("li");

        li.innerHTML = `
          <a href="${file.url}" download>
            ${game} - ${file.name}
          </a>
        `;

        sub.appendChild(li);
      });

      list.appendChild(sub);
    }
  }
}


// INITIAL LOAD
getTeams();

</script>

</body>
</html>
